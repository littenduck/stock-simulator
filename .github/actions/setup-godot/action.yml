name: Setup Godot
description: Installs the pinned Godot 4.7.2 headless binary (and optionally the Web export templates).
inputs:
  templates:
    description: "Install export templates when 'true'"
    default: "false"
runs:
  using: composite
  steps:
    - name: Cache Godot
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/godot-cache
        key: godot-4.7.2-stable-${{ inputs.templates }}
    - name: Download Godot
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        V=4.7.2-stable
        BASE=https://github.com/godotengine/godot-builds/releases/download/$V
        mkdir -p ~/godot-cache
        curl -fsSL -o /tmp/godot.zip "$BASE/Godot_v${V}_linux.x86_64.zip"
        unzip -q /tmp/godot.zip -d ~/godot-cache
        if [ "${{ inputs.templates }}" = "true" ]; then
          curl -fsSL -o /tmp/tpl.tpz "$BASE/Godot_v${V}_export_templates.tpz"
          unzip -q /tmp/tpl.tpz -d /tmp/tpl
          mkdir -p ~/godot-cache/templates/4.7.2.stable
          cp -r /tmp/tpl/templates/* ~/godot-cache/templates/4.7.2.stable/
        fi
    - name: Install into PATH
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p ~/.local/bin
        ln -sf ~/godot-cache/Godot_v4.7.2-stable_linux.x86_64 ~/.local/bin/godot
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        if [ -d ~/godot-cache/templates ]; then
          mkdir -p ~/.local/share/godot/export_templates
          rm -rf ~/.local/share/godot/export_templates/4.7.2.stable
          cp -r ~/godot-cache/templates/4.7.2.stable ~/.local/share/godot/export_templates/
        fi
